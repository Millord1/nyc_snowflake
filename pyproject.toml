[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "snowflake"
version = "1.0.0"
description = "snowflake ingetsion and dbt"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    "duckdb>=1.1.0",
    "requests>=2.32.0",
    "snowflake-connector-python>=3.12.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "httpx==0.27.2",
    "ruff==0.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py312"

exclude = [
    ".git",
    ".venv",
    "env",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = []

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = false